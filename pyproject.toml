[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-rag"
version = "0.1.0"
description = "Custom RAG Pipeline System for BlueCallom"
requires-python = ">=3.11"
dependencies = [
    "Django>=4.2.0,<5.0.0",
    "SQLAlchemy>=2.0.0,<3.0.0",
    "weaviate-client>=4.0.0,<5.0.0",
    "openai>=1.0.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pymysql>=1.1.0,<2.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0,<1.0.0",
    "black>=23.0.0,<24.0.0",
    "pytest>=7.0.0,<8.0.0",
    "pytest-django>=4.5.0,<5.0.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | env
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    "env",
    ".venv",
    "build",
    "dist",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = ["E501"]  # line too long (Black handles this)

[tool.ruff.lint.per-file-ignores]
"tests/test_cases.py" = ["T201"]  # Allow print statements in test runner CLI

[tool.ruff.lint.isort]
known-first-party = ["custom_rag"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]
# Exclude test_cases.py - expensive integration tests requiring live API calls
# Run manually with: python tests/test_cases.py --count N
addopts = "-v --tb=short --ignore=tests/test_cases.py"

[tool.coverage.run]
source = ["custom_rag"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
